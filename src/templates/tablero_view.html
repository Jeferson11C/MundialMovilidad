<div class="phase-switch" aria-label="Selector de fase">
    <button type="button" class="phase-switch-btn active" data-phase="partidos">Partidos</button>
    <button type="button" class="phase-switch-btn" data-phase="final">Fase final</button>
    <button type="button" class="phase-switch-btn" data-phase="grupos">Fase de grupos</button>
</div>

<div class="dashboard-grid" id="vista-tablero">
    <div class="columna-partidos">
            <div id="contenedor-principal"></div>
            <div class="other-columns" id="other-columns-layout">
                <div class="mobile-match-tabs" id="mobile-match-tabs">
                    <button type="button" class="mobile-match-tab" data-target="jugados">Partidos jugados</button>
                    <button type="button" class="mobile-match-tab active" data-target="resto">Resto de la jornada</button>
                </div>
                <div class="other-column" id="columna-jugados">
                    <h4 class="subsection-title subsection-title-orange" id="titulo-jugados">Partidos jugados</h4>
                    <div id="contenedor-jugados" class="other-matches"></div>
                </div>
                <div class="other-column" id="columna-resto">
                    <h4 class="subsection-title subsection-title-orange" id="titulo-resto">Resto de la jornada</h4>
                    <div id="contenedor-otros" class="other-matches"></div>
                </div>
            </div>
        </div>

    <div class="columna-grupos">
        <h3 class="section-title" id="titulo-columna-derecha">Posiciones de Grupos</h3>
        <div class="scroll-grupos" id="contenedor-grupos"></div>
    </div>
</div>
