<script>
    function cargarRanking() {
        fetch('/api/ranking')
            .then(res => res.json())
            .then(datos => renderizarRanking(datos.ranking || []))
            .catch(err => console.error('Error al cargar ranking:', err));
    }

    function renderizarRanking(ranking) {
        const body = document.getElementById('ranking-body');
        const resto = ranking;

        body.innerHTML = resto.length ? resto.map((u, index) => {
            const esTopActual = index < 3 && Number(u.puntos || 0) > 0;
            const insignias = [
                { texto: '1ero', clase: 'rank-1' },
                { texto: '2do', clase: 'rank-2' },
                { texto: '3ero', clase: 'rank-3' }
            ];
            const insignia = esTopActual ? insignias[index] : null;

            return `
            <tr class="${esTopActual ? `top-row top-${index + 1}` : ''}">
                <td>${u.posicion}</td>
                <td class="user-name">${u.nombre}</td>
                <td class="points">
                    <span class="points-value">${u.puntos}</span>
                    ${insignia ? `<span class="rank-badge ${insignia.clase}" title="${insignia.texto}" aria-label="${insignia.texto}">${insignia.texto}</span>` : ''}
                </td>
            </tr>
        `;
        }).join('') : '<tr><td colspan="3" class="empty-ranking">Todavia no hay participantes en el ranking.</td></tr>';
    }
</script>
