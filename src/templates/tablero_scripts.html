<script>
    let datosTableroActual = null;
    let faseActiva = 'partidos';
    let tableroReintentos = 0;

    function obtenerCodigoBandera(nombrePais) {
        const codigos = {
            'Mexico': 'mx', 'México': 'mx',
            'South Africa': 'za', 'Sudáfrica': 'za',
            'Korea Republic': 'kr', 'Corea del Sur': 'kr',
            'Czechia': 'cz', 'Chequia': 'cz',
            'Canada': 'ca', 'Canadá': 'ca',
            'Bosnia-Herzegovina': 'ba', 'Bosnia y Herzegovina': 'ba',
            'USA': 'us', 'Estados Unidos': 'us',
            'Paraguay': 'py',
            'Qatar': 'qa', 'Catar': 'qa',
            'Switzerland': 'ch', 'Suiza': 'ch',
            'Brazil': 'br', 'Brasil': 'br',
            'Morocco': 'ma', 'Marruecos': 'ma',
            'Haiti': 'ht', 'Haití': 'ht',
            'Scotland': 'gb-sct', 'Escocia': 'gb-sct',
            'Australia': 'au',
            'Turkey': 'tr', 'Turquía': 'tr',
            'Germany': 'de', 'Alemania': 'de',
            'Curaçao': 'cw', 'Curazao': 'cw',
            'Netherlands': 'nl', 'Países Bajos': 'nl',
            'Japan': 'jp', 'Japón': 'jp',
            "Côte d'Ivoire": 'ci', 'Costa de Marfil': 'ci',
            'Ecuador': 'ec',
            'Sweden': 'se', 'Suecia': 'se',
            'Tunisia': 'tn', 'Túnez': 'tn',
            'Spain': 'es', 'España': 'es',
            'Cabo Verde': 'cv',
            'Belgium': 'be', 'Bélgica': 'be',
            'Egypt': 'eg', 'Egipto': 'eg',
            'Saudi Arabia': 'sa', 'Arabia Saudita': 'sa',
            'Uruguay': 'uy',
            'IR Iran': 'ir', 'Irán': 'ir',
            'New Zealand': 'nz', 'Nueva Zelanda': 'nz',
            'France': 'fr', 'Francia': 'fr',
            'Senegal': 'sn',
            'Iraq': 'iq', 'Irak': 'iq',
            'Norway': 'no', 'Noruega': 'no',
            'Argentina': 'ar',
            'Algeria': 'dz', 'Argelia': 'dz',
            'Austria': 'at',
            'Jordan': 'jo', 'Jordania': 'jo',
            'Portugal': 'pt',
            'Congo DR': 'cd', 'RD del Congo': 'cd',
            'Uzbekistan': 'uz', 'Uzbekistán': 'uz',
            'Colombia': 'co',
            'England': 'gb-eng', 'Inglaterra': 'gb-eng',
            'Croatia': 'hr', 'Croacia': 'hr',
            'Ghana': 'gh',
            'Panama': 'pa', 'Panamá': 'pa'
        };

        return codigos[nombrePais] || null;
    }

    function banderaHtml(nombrePais) {
        const code = obtenerCodigoBandera(nombrePais);
        if (!code) {
            return '';
        }
        return `<img src="https://media.api-sports.io/flags/${code}.svg" alt="${nombrePais}" class="flag-icon" onerror="this.style.display='none';">`;
    }

    function claseNombreEquipo(nombrePais) {
        const largo = (nombrePais || '').length;
        if (largo >= 18) {
            return ' team-name-very-long';
        }
        if (largo >= 12) {
            return ' team-name-long';
        }
        return '';
    }

    function traducirEstado(status) {
        const estados = { 'scheduled': 'Programado', 'live': 'En Curso', 'in_progress': 'En Curso', 'completed': 'Finalizado', 'postponed': 'Postergado', 'cancelled': 'Cancelado', 'suspended': 'Suspendido' };
        return estados[status.toLowerCase()] || status;
    }

    function traducirRonda(round) {
        const rondas = { 'group': 'Fase de Grupos', 'round': 'Fase de Grupos', 'r32': 'Dieciseisavos', 'r16': 'Octavos', 'qf': 'Cuartos', 'sf': 'Semifinal', '3rd': 'Tercer Puesto', 'final': 'Final' };
        return rondas[round.toLowerCase()] || round;
    }

    function cargarDatos() {
        fetch('/api/datos_tablero')
            .then(res => res.json())
            .then(datos => {
                datosTableroActual = datos;
                renderizarVistaActiva();
                if (datos.actualizando && tableroReintentos < 5) {
                    tableroReintentos += 1;
                    setTimeout(cargarDatos, 2000);
                } else if (!datos.actualizando) {
                    tableroReintentos = 0;
                }
            })
            .catch(err => console.error('Error al cargar:', err));
    }

    function configurarSelectorFase() {
        const botones = Array.from(document.querySelectorAll('.phase-switch-btn'));
        botones.forEach(boton => {
            boton.addEventListener('click', () => {
                faseActiva = boton.dataset.phase || 'partidos';
                botones.forEach(item => {
                    const activo = item.dataset.phase === faseActiva;
                    item.classList.toggle('active', activo);
                    item.setAttribute('aria-pressed', activo ? 'true' : 'false');
                });
                renderizarVistaActiva();
            });
            boton.setAttribute('aria-pressed', boton.classList.contains('active') ? 'true' : 'false');
        });
    }

    function renderizarVistaActiva() {
        if (!datosTableroActual) {
            return;
        }

        const tituloDerecho = document.getElementById('titulo-columna-derecha');
        const vistaTablero = document.getElementById('vista-tablero');

        vistaTablero.classList.remove('matches-mode', 'final-mode', 'groups-mode');

        if (faseActiva === 'final') {
            const finales = datosTableroActual.partidos_finales || [];
            vistaTablero.classList.add('final-mode');
            limpiarPartidos();
            tituloDerecho.innerText = 'Llave de Fase Final';
            renderizarLlaveFinal(finales);
            return;
        }

        if (faseActiva === 'grupos') {
            vistaTablero.classList.add('groups-mode');
            limpiarPartidos();
            tituloDerecho.innerText = 'Posiciones de Grupos';
            renderizarGrupos(datosTableroActual.grupos || []);
            return;
        }

        vistaTablero.classList.add('matches-mode');
        renderizarPrincipal(datosTableroActual.principales || datosTableroActual.principal);
        renderizarOtros(datosTableroActual.jugados || [], datosTableroActual.otros || []);
        actualizarTitulosListas('Partidos jugados', 'Proximos partidos');
        tituloDerecho.innerText = '';
        document.getElementById('contenedor-grupos').innerHTML = '';
    }

    function limpiarPartidos() {
        document.getElementById('contenedor-principal').innerHTML = '';
        document.getElementById('contenedor-jugados').innerHTML = '';
        document.getElementById('contenedor-otros').innerHTML = '';
    }

    function actualizarTitulosListas(tituloJugados, tituloResto) {
        const tituloJugadosEl = document.getElementById('titulo-jugados');
        const tituloRestoEl = document.getElementById('titulo-resto');
        if (tituloJugadosEl) {
            tituloJugadosEl.innerText = tituloJugados;
        }
        if (tituloRestoEl) {
            tituloRestoEl.innerText = tituloResto;
        }
    }

    function seleccionarPartidosDestacados(partidos) {
        const ordenados = [...(partidos || [])].sort((a, b) => (a.kickoff_utc || '').localeCompare(b.kickoff_utc || ''));
        const noCompletados = ordenados.filter(p => p.status !== 'completed');
        const base = noCompletados.length ? noCompletados : ordenados.slice(-1);
        const primero = base[0];

        if (!primero) {
            return [];
        }

        const fecha = primero.fecha_peru_key || (primero.kickoff_utc || '').slice(0, 10);
        const hora = primero.hora_peru || '';
        return base.filter(p => {
            const fechaPartido = p.fecha_peru_key || (p.kickoff_utc || '').slice(0, 10);
            return fechaPartido === fecha && (p.hora_peru || '') === hora;
        });
    }

    function tienePenales(partido) {
        return partido.home_pen !== null
            && partido.home_pen !== undefined
            && partido.away_pen !== null
            && partido.away_pen !== undefined;
    }

    function marcadorTexto(partido) {
        if (partido.home_score === null || partido.home_score === undefined || partido.away_score === null || partido.away_score === undefined) {
            return '';
        }
        if (tienePenales(partido)) {
            return `${partido.home_score}(${partido.home_pen}) - (${partido.away_pen})${partido.away_score}`;
        }
        return `${partido.home_score} - ${partido.away_score}`;
    }

    function marcadorHtml(partido) {
        const texto = marcadorTexto(partido);
        return texto ? `<span>${texto}</span>` : '<span class="vs-label">VS</span>';
    }

    function construirPartidoPrincipal(partido, esMultiple) {
        const estado = traducirEstado(partido.status);
        const estadoKey = partido.status ? partido.status.toLowerCase() : '';
        const mostrarMarcador = estadoKey !== 'scheduled';
        const estadoClase = estadoKey ? ` status-${estadoKey}` : '';
        const marcadorCentroHtml = mostrarMarcador ? marcadorHtml(partido) : `<span class="vs-label">VS</span>`;
        const infoTiempo = estado === 'Programado'
            ? `Programado - ${partido.fecha_peru_str} - ${partido.hora_peru}`
            : estado;
        const faseText = partido.group_name ? `Grupo ${partido.group_name}` : traducirRonda(partido.round);
        const faseHeader = partido.group_name ? `<div class="match-phase-header">${faseText}</div>` : '';
        const sedePrincipal = [partido.stadium, partido.stadium_city, partido.stadium_country].filter(Boolean).join(' - ');
        const multipleClass = esMultiple ? ' hero-match-compact' : '';

        return `
            <section class="hero-match${multipleClass}">
                ${faseHeader}
                <div class="match-status${estadoClase}">${infoTiempo}</div>
                <div class="scoreboard">
                    <div class="team team-principal">
                        <div class="team-main-identity">
                            ${banderaHtml(partido.home_team)}
                            <h2 class="${claseNombreEquipo(partido.home_team)}">${partido.home_team || 'Por Clasificar'}</h2>
                        </div>
                    </div>
                    <div class="score-center">
                        <div class="score">${marcadorCentroHtml}</div>
                        <div class="tournament-badge">MUNDIAL 2026</div>
                    </div>
                    <div class="team team-principal">
                        <div class="team-main-identity">
                            ${banderaHtml(partido.away_team)}
                            <h2 class="${claseNombreEquipo(partido.away_team)}">${partido.away_team || 'Por Clasificar'}</h2>
                        </div>
                    </div>
                </div>
                <div class="stadium-info">${sedePrincipal || 'Sede por confirmar'}</div>
            </section>
        `;
    }

    function renderizarPrincipal(partidosPrincipal) {
        const contenedor = document.getElementById('contenedor-principal');
        const partidos = Array.isArray(partidosPrincipal)
            ? partidosPrincipal
            : (partidosPrincipal ? [partidosPrincipal] : []);

        if (!partidos.length) {
            contenedor.innerHTML = '<div class="hero-match"><p>No hay partidos programados para hoy.</p></div>';
            return;
        }

        const esMultiple = partidos.length > 1;
        const partidosHtml = partidos.map(partido => construirPartidoPrincipal(partido, esMultiple)).join('');
        contenedor.innerHTML = esMultiple
            ? `<div class="hero-match-grid">${partidosHtml}</div>`
            : partidosHtml;
    }

    function renderizarOtros(partidosJugados, partidosPorJugar) {
        const contenedorJugados = document.getElementById('contenedor-jugados');
        const contenedorPorJugar = document.getElementById('contenedor-otros');
        const layout = document.getElementById('other-columns-layout');
        const columnaJugados = document.getElementById('columna-jugados');
        const columnaResto = document.getElementById('columna-resto');
        const tabsMoviles = document.getElementById('mobile-match-tabs');
        let htmlJugados = '';
        let htmlPorJugar = '';

        function construirCard(p, esJugado) {
            const infoFase = p.group_name ? `Grupo ${p.group_name}` : traducirRonda(p.round);
            const fechaMostrar = p.fecha_peru_str || '';
            const sede = [p.stadium, p.stadium_city, p.stadium_country].filter(Boolean).join(' - ');
            const marcadorFinal = p.home_score !== null && p.away_score !== null
                ? `<span class="mini-final-label">FIN</span><strong class="mini-score-pill">${marcadorTexto(p)}</strong>`
                : '<span>FIN</span>';
            const centroPartido = esJugado ? marcadorFinal : 'VS';
            return `
                <div class="match-card match-card-next">
                    <div class="card-header card-header-next">
                        <span class="fase-tag">${infoFase}</span>
                        <span class="fecha-hora-tag">${fechaMostrar} - ${p.hora_peru}</span>
                    </div>
                    <div class="mini-scoreboard">
                        <div class="mini-team">
                            <div class="mini-team-identity">
                                ${banderaHtml(p.home_team)}
                                <span class="mini-team-name">${p.home_team || 'Por Clasificar'}</span>
                            </div>
                        </div>
                        <div class="${esJugado ? 'mini-final-score' : 'mini-vs'}">${centroPartido}</div>
                        <div class="mini-team">
                            <div class="mini-team-identity">
                                ${banderaHtml(p.away_team)}
                                <span class="mini-team-name">${p.away_team || 'Por Clasificar'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="match-venue">${sede || 'Sede por confirmar'}</div>
                </div>
            `;
        }

        function agruparPorFecha(partidos) {
            const grupos = {};
            partidos.forEach(p => {
                const key = p.fecha_peru_key || (p.kickoff_utc ? p.kickoff_utc.slice(0, 10) : 'sin-fecha');
                if (!grupos[key]) {
                    grupos[key] = {
                        fechaLabel: p.fecha_peru_str || key,
                        partidos: []
                    };
                }
                grupos[key].partidos.push(p);
            });
            return grupos;
        }

        function renderizarGruposFecha(partidos, esJugado, descendente, ocultarPrimeraFecha) {
            if (!partidos.length) {
                return '';
            }

            const grupos = agruparPorFecha(partidos);
            const fechas = Object.keys(grupos).sort((a, b) => descendente ? b.localeCompare(a) : a.localeCompare(b));
            let html = '';

            fechas.forEach((fecha, idx) => {
                const grupo = grupos[fecha];
                const partidosOrdenados = grupo.partidos.sort((a, b) => (a.kickoff_utc || '').localeCompare(b.kickoff_utc || ''));
                if (!(ocultarPrimeraFecha && idx === 0)) {
                    html += `<div class="date-separator">${grupo.fechaLabel}</div>`;
                }
                partidosOrdenados.forEach(p => {
                    html += construirCard(p, esJugado);
                });
            });

            return html;
        }

        htmlJugados = renderizarGruposFecha(partidosJugados, true, true, false);
        htmlPorJugar = renderizarGruposFecha(partidosPorJugar, false, false, false);

        if (partidosJugados.length > 0) {
            layout.classList.remove('solo-resto');
            columnaJugados.classList.remove('hidden');
            contenedorJugados.innerHTML = htmlJugados;
        } else {
            layout.classList.add('solo-resto');
            columnaJugados.classList.add('hidden');
            contenedorJugados.innerHTML = '';
        }

        contenedorPorJugar.innerHTML = htmlPorJugar || '<div class="empty-column">No hay más partidos por jugar.</div>';
        configurarTabsMovilesPartidos({
            layout,
            tabsMoviles,
            columnaJugados,
            columnaResto,
            hayJugados: partidosJugados.length > 0
        });
    }

    function configurarTabsMovilesPartidos({ layout, tabsMoviles, columnaJugados, columnaResto, hayJugados }) {
        if (!layout || !tabsMoviles || !columnaJugados || !columnaResto) {
            return;
        }

        const tabs = Array.from(tabsMoviles.querySelectorAll('.mobile-match-tab'));
        const tabJugados = tabsMoviles.querySelector('[data-target="jugados"]');
        const tabResto = tabsMoviles.querySelector('[data-target="resto"]');

        tabsMoviles.classList.toggle('hidden', !hayJugados);
        if (!hayJugados) {
            layout.classList.remove('mobile-show-jugados', 'mobile-show-resto');
            return;
        }

        function activar(target) {
            tabs.forEach(tab => {
                const activo = tab.dataset.target === target;
                tab.classList.toggle('active', activo);
                tab.setAttribute('aria-selected', activo ? 'true' : 'false');
            });
            layout.classList.toggle('mobile-show-jugados', target === 'jugados');
            layout.classList.toggle('mobile-show-resto', target === 'resto');
            tabsMoviles.dataset.activeTarget = target;
        }

        if (!tabsMoviles.dataset.inicializado) {
            tabs.forEach(tab => {
                tab.addEventListener('click', () => activar(tab.dataset.target));
            });
            tabsMoviles.dataset.inicializado = 'true';
        }

        tabJugados.disabled = !hayJugados;
        tabResto.disabled = false;
        activar(tabsMoviles.dataset.activeTarget || 'resto');
    }

    function renderizarGrupos(grupos) {
        const contenedor = document.getElementById('contenedor-grupos');
        let html = '';
        grupos.forEach(grupo => {
            let filas = '';
            grupo.equipos.forEach((eq, index) => {
                const clasificado = Boolean(eq.clasificado);
                const estadoClase = clasificado ? 'is-qualified' : 'is-eliminated';
                filas += `
                    <tr class="${estadoClase}">
                        <td class="position-cell">${index + 1}</td>
                        <td class="team-cell-name">${banderaHtml(eq.nombre)}${eq.nombre}</td>
                        <td>${eq.pj}</td>
                        <td>${eq.dg}</td>
                        <td class="pts-cell">${eq.pts}</td>
                    </tr>
                `;
            });
            html += `
                <div class="tabla-grupo-container">
                    <div class="titulo-grupo">${grupo.nombre}</div>
                    <table class="tabla-grupo">
                        <thead>
                            <tr><th></th><th>Equipo</th><th>PJ</th><th>DG</th><th>Pts</th></tr>
                        </thead>
                    <tbody>${filas}</tbody></table>
                </div>
            `;
        });
        contenedor.innerHTML = `
            ${html}
            <div class="groups-legend">
                <div class="groups-legend-title">Leyenda</div>
                <div class="groups-legend-items">
                    <span><i class="legend-mark legend-qualified"></i> Clasificado</span>
                    <span><i class="legend-mark legend-eliminated"></i> Eliminado</span>
                </div>
            </div>
        `;
    }

    function obtenerGanadorPartido(partido) {
        if (!partido || partido.status !== 'completed') {
            return null;
        }

        if (partido.home_pen !== null && partido.away_pen !== null) {
            return partido.home_pen > partido.away_pen ? 'home' : 'away';
        }

        if (partido.home_score > partido.away_score) {
            return 'home';
        }
        if (partido.away_score > partido.home_score) {
            return 'away';
        }
        return null;
    }

    function construirEquipoLlave(partido, lado, ganador) {
        const nombre = partido[`${lado}_team`] || 'Por Clasificar';
        const score = partido[`${lado}_score`];
        const penales = partido[`${lado}_pen`];
        const claseGanador = ganador === lado ? ' is-winner' : '';
        const scorePenales = `${score}(${penales})`;
        const marcador = score !== null
            ? `<span class="bracket-score">${penales !== null ? scorePenales : score}</span>`
            : '<span class="bracket-score">-</span>';

        return `
            <div class="bracket-team${claseGanador}">
                <span class="bracket-team-name">${banderaHtml(nombre)}${nombre}</span>
                ${marcador}
            </div>
        `;
    }

    function construirPartidoLlave(partido) {
        const ganador = obtenerGanadorPartido(partido);

        return `
            <div class="bracket-match status-${partido.status || 'scheduled'}">
                ${construirEquipoLlave(partido, 'home', ganador)}
                ${construirEquipoLlave(partido, 'away', ganador)}
            </div>
        `;
    }

    const ordenR32Bracket = [
        { home_team_code: 'GER', away_team_code: 'PAR', home_team: 'Alemania', away_team: 'Paraguay', lado: 'izquierda' },
        { home_team_code: 'FRA', away_team_code: 'SWE', home_team: 'Francia', away_team: 'Suecia', lado: 'izquierda' },
        { home_team_code: 'RSA', away_team_code: 'CAN', home_team: 'Sudáfrica', away_team: 'Canadá', lado: 'izquierda' },
        { home_team_code: 'NED', away_team_code: 'MAR', home_team: 'Países Bajos', away_team: 'Marruecos', lado: 'izquierda' },
        { home_team_code: 'POR', away_team_code: 'CRO', home_team: 'Portugal', away_team: 'Croacia', lado: 'izquierda' },
        { home_team_code: 'ESP', away_team_code: 'AUT', home_team: 'España', away_team: 'Austria', lado: 'izquierda' },
        { home_team_code: 'USA', away_team_code: 'BIH', home_team: 'Estados Unidos', away_team: 'Bosnia y Herzegovina', lado: 'izquierda' },
        { home_team_code: 'BEL', away_team_code: 'SEN', home_team: 'Bélgica', away_team: 'Senegal', lado: 'izquierda' },
        { home_team_code: 'BRA', away_team_code: 'JPN', home_team: 'Brasil', away_team: 'Japón', lado: 'derecha' },
        { home_team_code: 'CIV', away_team_code: 'NOR', home_team: 'Costa de Marfil', away_team: 'Noruega', lado: 'derecha' },
        { home_team_code: 'MEX', away_team_code: 'ECU', home_team: 'México', away_team: 'Ecuador', lado: 'derecha' },
        { home_team_code: 'ENG', away_team_code: 'COD', home_team: 'Inglaterra', away_team: 'RD del Congo', lado: 'derecha' },
        { home_team_code: 'ARG', away_team_code: 'CPV', home_team: 'Argentina', away_team: 'Cabo Verde', lado: 'derecha' },
        { home_team_code: 'AUS', away_team_code: 'EGY', home_team: 'Australia', away_team: 'Egipto', lado: 'derecha' },
        { home_team_code: 'SUI', away_team_code: 'ALG', home_team: 'Suiza', away_team: 'Argelia', lado: 'derecha' },
        { home_team_code: 'COL', away_team_code: 'GHA', home_team: 'Colombia', away_team: 'Ghana', lado: 'derecha' }
    ];

    function construirPartidoSeedR32(seed, partido) {
        return {
            ...(partido || {}),
            round: 'R32',
            status: (partido && partido.status) || 'scheduled',
            home_team: (partido && partido.home_team) || seed.home_team,
            away_team: (partido && partido.away_team) || seed.away_team,
            home_team_code: (partido && partido.home_team_code) || seed.home_team_code,
            away_team_code: (partido && partido.away_team_code) || seed.away_team_code,
            home_score: partido ? partido.home_score : null,
            away_score: partido ? partido.away_score : null,
            home_pen: partido ? partido.home_pen : null,
            away_pen: partido ? partido.away_pen : null
        };
    }

    function ordenarR32PorBracket(partidosR32) {
        const usados = new Set();
        const partidos = partidosR32 || [];
        const buscarPartido = (seed) => {
            let indice = partidos.findIndex((p, idx) => {
                if (usados.has(idx)) return false;
                return p.home_team_code === seed.home_team_code && p.away_team_code === seed.away_team_code;
            });
            if (indice === -1) {
                indice = partidos.findIndex((p, idx) => {
                    if (usados.has(idx)) return false;
                    const codigos = [p.home_team_code, p.away_team_code].filter(Boolean);
                    return codigos.includes(seed.home_team_code) || codigos.includes(seed.away_team_code);
                });
            }
            if (indice === -1) {
                return null;
            }
            usados.add(indice);
            return partidos[indice];
        };

        const ordenados = ordenR32Bracket.map(seed => construirPartidoSeedR32(seed, buscarPartido(seed)));
        return {
            izquierda: ordenados.filter((_, idx) => ordenR32Bracket[idx].lado === 'izquierda'),
            derecha: ordenados.filter((_, idx) => ordenR32Bracket[idx].lado === 'derecha')
        };
    }

    function ordenarPartidosPorLlave(partidos) {
        return [...(partidos || [])].sort((a, b) => {
            const matchA = Number(a.match_number || 0);
            const matchB = Number(b.match_number || 0);
            if (matchA && matchB && matchA !== matchB) {
                return matchA - matchB;
            }
            return (a.kickoff_utc || '').localeCompare(b.kickoff_utc || '');
        });
    }

    function equipoDesdePartido(partido, lado) {
        if (!partido || !partido[`${lado}_team`]) {
            return null;
        }
        return {
            team: partido[`${lado}_team`],
            code: partido[`${lado}_team_code`] || null
        };
    }

    function ganadorComoEquipo(partido) {
        const ganador = obtenerGanadorPartido(partido);
        if (!ganador) {
            return null;
        }
        return equipoDesdePartido(partido, ganador);
    }

    function normalizarClaveEquipo(valor) {
        return (valor || '')
            .toString()
            .trim()
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '');
    }

    function clavesEquipo(equipo) {
        if (!equipo || (!equipo.team && !equipo.code)) {
            return [];
        }
        return [equipo.code, equipo.team]
            .map(normalizarClaveEquipo)
            .filter(Boolean)
            .filter(valor => valor !== 'por clasificar');
    }

    function clavesParticipantes(partido) {
        if (!partido) {
            return [];
        }
        return [
            ...clavesEquipo(equipoDesdePartido(partido, 'home')),
            ...clavesEquipo(equipoDesdePartido(partido, 'away'))
        ];
    }

    function clavesEsperadasDesdePartido(partido) {
        const ganador = ganadorComoEquipo(partido);
        if (ganador) {
            return clavesEquipo(ganador);
        }
        return clavesParticipantes(partido);
    }

    function buscarPartidoRealPorCruce(reales, usados, parFuente) {
        const clavesEsperadas = new Set([
            ...clavesEsperadasDesdePartido(parFuente[0]),
            ...clavesEsperadasDesdePartido(parFuente[1])
        ]);

        if (!clavesEsperadas.size) {
            return null;
        }

        const indice = reales.findIndex((partido, idx) => {
            if (usados.has(idx)) {
                return false;
            }
            return clavesParticipantes(partido).some(clave => clavesEsperadas.has(clave));
        });

        if (indice === -1) {
            return null;
        }

        usados.add(indice);
        return reales[indice];
    }

    function construirPartidoDerivado(round, partidoReal, home, away) {
        const base = partidoReal || {};
        return {
            ...base,
            round,
            status: base.status || 'scheduled',
            home_team: base.home_team || (home && home.team) || null,
            home_team_code: base.home_team_code || (home && home.code) || null,
            away_team: base.away_team || (away && away.team) || null,
            away_team_code: base.away_team_code || (away && away.code) || null,
            home_score: partidoReal ? base.home_score : null,
            away_score: partidoReal ? base.away_score : null,
            home_pen: partidoReal ? base.home_pen : null,
            away_pen: partidoReal ? base.away_pen : null
        };
    }

    function construirRondaDerivada(round, partidosReales, fuentes) {
        const reales = ordenarPartidosPorLlave(partidosReales);
        const usados = new Set();
        return fuentes.map((par, idx) => {
            const home = ganadorComoEquipo(par[0]);
            const away = ganadorComoEquipo(par[1]);
            const partidoReal = buscarPartidoRealPorCruce(reales, usados, par);
            const tieneCruceEsperado = [
                ...clavesEsperadasDesdePartido(par[0]),
                ...clavesEsperadasDesdePartido(par[1])
            ].length > 0;
            const partidoFallback = !tieneCruceEsperado && !usados.has(idx) ? reales[idx] : null;
            if (partidoFallback) {
                usados.add(idx);
            }
            return construirPartidoDerivado(round, partidoReal || partidoFallback, home, away);
        });
    }

    function dividirPartidosLlave(partidos, cantidadIzquierda) {
        const ordenados = ordenarPartidosPorLlave(partidos);
        return {
            izquierda: ordenados.slice(0, cantidadIzquierda),
            derecha: ordenados.slice(cantidadIzquierda)
        };
    }

    function construirColumnaLlave(label, partidos, lado, rondaId) {
        const partidosHtml = partidos.length
            ? partidos.map(construirPartidoLlave).join('')
            : '<div class="bracket-placeholder">Por definirse</div>';

        return `
            <section class="bracket-round bracket-round-${rondaId.toLowerCase()} bracket-${lado}">
                <div class="bracket-round-label">${label}</div>
                <div class="bracket-matches">${partidosHtml}</div>
            </section>
        `;
    }

    function renderizarLlaveFinal(partidos) {
        const contenedor = document.getElementById('contenedor-grupos');
        const partidosPorRonda = {};

        (partidos || []).forEach(partido => {
            if (!partidosPorRonda[partido.round]) {
                partidosPorRonda[partido.round] = [];
            }
            partidosPorRonda[partido.round].push(partido);
        });

        const r32 = ordenarR32PorBracket(partidosPorRonda.R32);
        const partidosR16 = partidosPorRonda.R16 || [];
        const partidosQF = partidosPorRonda.QF || [];
        const partidosSF = partidosPorRonda.SF || [];
        const r16 = {
            izquierda: construirRondaDerivada('R16', partidosR16, [
                [r32.izquierda[0], r32.izquierda[1]],
                [r32.izquierda[2], r32.izquierda[3]],
                [r32.izquierda[4], r32.izquierda[5]],
                [r32.izquierda[6], r32.izquierda[7]]
            ]),
            derecha: construirRondaDerivada('R16', partidosR16, [
                [r32.derecha[0], r32.derecha[1]],
                [r32.derecha[2], r32.derecha[3]],
                [r32.derecha[4], r32.derecha[5]],
                [r32.derecha[6], r32.derecha[7]]
            ])
        };
        const qf = {
            izquierda: construirRondaDerivada('QF', partidosQF, [
                [r16.izquierda[0], r16.izquierda[1]],
                [r16.izquierda[2], r16.izquierda[3]]
            ]),
            derecha: construirRondaDerivada('QF', partidosQF, [
                [r16.derecha[0], r16.derecha[1]],
                [r16.derecha[2], r16.derecha[3]]
            ])
        };
        const sf = {
            izquierda: construirRondaDerivada('SF', partidosSF, [
                [qf.izquierda[0], qf.izquierda[1]]
            ]),
            derecha: construirRondaDerivada('SF', partidosSF, [
                [qf.derecha[0], qf.derecha[1]]
            ])
        };
        const finalReal = ordenarPartidosPorLlave(partidosPorRonda.final)[0];
        const final = construirPartidoDerivado(
            'final',
            finalReal,
            ganadorComoEquipo(sf.izquierda[0]),
            ganadorComoEquipo(sf.derecha[0])
        );

        const tercerPuesto = (partidosPorRonda['3rd'] || [])[0];
        const tercerPuestoHtml = tercerPuesto
            ? `<section class="third-place-bracket">
                    <div class="bracket-round-label">3er puesto</div>
                    ${construirPartidoLlave(tercerPuesto)}
               </section>`
            : '';

        contenedor.innerHTML = `
            <div class="bracket-board">
                <div class="bracket-side bracket-side-left">
                    ${construirColumnaLlave('16vos', r32.izquierda, 'left', 'R32')}
                    ${construirColumnaLlave('8vos', r16.izquierda, 'left', 'R16')}
                    ${construirColumnaLlave('4tos', qf.izquierda, 'left', 'QF')}
                    ${construirColumnaLlave('Semis', sf.izquierda, 'left', 'SF')}
                </div>
                <section class="bracket-final">
                    <div class="bracket-round-label">Final</div>
                    ${final ? construirPartidoLlave(final) : '<div class="bracket-placeholder">Por definirse</div>'}
                </section>
                <div class="bracket-side bracket-side-right">
                    ${construirColumnaLlave('Semis', sf.derecha, 'right', 'SF')}
                    ${construirColumnaLlave('4tos', qf.derecha, 'right', 'QF')}
                    ${construirColumnaLlave('8vos', r16.derecha, 'right', 'R16')}
                    ${construirColumnaLlave('16vos', r32.derecha, 'right', 'R32')}
                </div>
                ${tercerPuestoHtml}
            </div>
        `;
    }
</script>
