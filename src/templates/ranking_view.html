<section id="vista-ranking" class="ranking-view">
    <h3 class="section-title">Ranking General de Participantes</h3>
    <div class="ranking-phase-switch" aria-label="Selector de ranking">
        <button type="button" class="ranking-phase-btn active" data-ranking-phase="grupos">Ranking fase de grupos</button>
        <button type="button" class="ranking-phase-btn" data-ranking-phase="final">Ranking fase final</button>
    </div>
    <div class="ranking-tabla-wrap">
        <table class="ranking-table">
            <thead>
                <tr>
                    <th>Orden</th>
                    <th>Usuario</th>
                    <th>Puntos</th>
                </tr>
            </thead>
            <tbody id="ranking-body"></tbody>
        </table>
    </div>
</section>
